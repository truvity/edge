registry:
  auth: ecr
  ack:
    enabled: true
    clusterName: example
    repositoryArns:
      - arn:aws:ecr:eu-central-1:123456789012:repository/example
    allowedExtraActions:
      - appconfig:StartConfigurationSession
      - appconfig:GetLatestConfiguration
    extraStatements:
      - Effect: Allow
        Action: ["appconfig:GetLatestConfiguration", "s3:GetObject"]
        Resource: ["arn:aws:s3:::example/flags.json"]
