defaults:
  parent: {name: public}
  certificate: {issuerRef: {name: ca, kind: ClusterIssuer, group: cert-manager.io}}
  allowedRoutes:
    namespaces:
      from: Selector
      selector:
        matchExpressions: [{key: kubernetes.io/metadata.name, operator: In, values: [a, b]}]
groups:
  g:
    domains:
      - host: audit.example.com
        paths: [{prefix: /a, namespace: a}, {prefix: /b, namespace: b}, {prefix: /c, namespace: c}]
