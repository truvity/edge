defaults:
  parent: {name: public}
  certificate: {issuerRef: {name: ca, kind: ClusterIssuer, group: cert-manager.io}}
  allowedRoutes:
    namespaces:
      from: Selector
      selector:
        matchLabels: {example.com/route-grant: "true"}
groups:
  g:
    domains:
      - host: audit.example.com
        paths: [{prefix: /a, namespace: a}]
