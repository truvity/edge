---
# Source: gateway-groups/templates/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: umbrella-corp-example-com-tls
  namespace: envoy-gateway-system
spec:
  secretName: umbrella-corp-example-com-tls
  dnsNames:
    - "umbrella-corp.example.com"
  privateKey:
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-ca

---
# Source: gateway-groups/templates/listenerset.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: umbrella-corp
  namespace: envoy-gateway-system
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: public
    namespace: envoy-gateway-system
  listeners:
    - allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              gateway.example.com/route-grant-umbrella-corp: "true"
      hostname: umbrella-corp.example.com
      name: umbrella-corp-example-com
      port: 443
      protocol: HTTPS
      tls:
        certificateRefs:
        - group: ""
          kind: Secret
          name: umbrella-corp-example-com-tls
        mode: Terminate
