---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: private-health-tls
  namespace: envoy-gateway-system
spec:
  secretName: private-health-tls
  dnsNames:
    - "gateway-health.internal.example"
  privateKey:
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-ca

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-health-tls
  namespace: envoy-gateway-system
spec:
  secretName: public-health-tls
  dnsNames:
    - "gateway-health.example.com"
  privateKey:
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-ca

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: private-tls
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private
  tls:
    minVersion: "1.3"
    maxVersion: "1.3"

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: private-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    kubernetes:
      envoyDeployment:
        replicas: 3
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        annotations:
          lbipam.cilium.io/ips: 192.0.2.40
        name: gateway-private
        type: LoadBalancer
    type: Kubernetes

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    kubernetes:
      envoyDeployment:
        replicas: 3
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        name: gateway-public
        type: ClusterIP
    type: Kubernetes

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: envoy-gateway-system
spec:
  gatewayClassName: edge
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: private-proxy
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "gateway-health.internal.example"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: private-health-tls
      allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Same

---
