---
# Source: gateway-fleet/templates/controller-networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      control-plane: envoy-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # xDS from the proxies.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge-staff-nlb
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge-tenant-a-cloudflare
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: edge-tenant-b-cloudflare
          podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - port: 18000
          protocol: TCP
  egress:
    # The API server.
    - to:
        - ipBlock:
            cidr: 10.0.0.1/32
      ports:
        - port: 443
          protocol: TCP
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# Source: gateway-fleet/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-staff-nlb
  namespace: edge-staff-nlb
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gateway-name: staff-nlb
      gateway.envoyproxy.io/owning-gateway-namespace: edge-staff-nlb
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - ipBlock:
          cidr: 10.0.0.0/14
      ports:
      - port: 10443
        protocol: TCP
  egress:
    # xDS to the controller. Structural: without it the proxies never receive
    # a configuration and the exposure is dark, whatever else is allowed.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
          podSelector:
            matchLabels:
              control-plane: envoy-gateway
      ports:
        - port: 18000
          protocol: TCP

