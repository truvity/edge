# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: staff-nlb
  namespace: edge-staff-nlb
spec:
  gatewayClassName: nlb
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: staff-nlb-proxy
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "gateway-health.staff.internal.example"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: staff-nlb-health-tls
      allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Same

