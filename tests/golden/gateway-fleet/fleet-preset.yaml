---
# Source: gateway-fleet/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-public
  namespace: envoy-gateway-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gatewayclass: internal
  policyTypes:
    - Ingress
    - Egress
  egress:
    # xDS to the controller. Structural: without it the proxies never receive
    # a configuration and the exposure is dark, whatever else is allowed.
    - to:
        - podSelector:
            matchLabels:
              control-plane: envoy-gateway
      ports:
        - port: 18000
          protocol: TCP
    - ports:
      - port: 8080
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: example-ui
        podSelector:
          matchLabels:
            app.kubernetes.io/name: example-ui
    - ports:
      - port: 9090
        protocol: TCP
      to:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: example-metrics
    - ports:
      - port: 4180
        protocol: TCP
      to:
      - namespaceSelector: {}
        podSelector:
          matchLabels:
            app.kubernetes.io/name: example-proxy
    - to:
      - namespaceSelector:
          matchExpressions:
          - key: example.com/tier
            operator: In
            values:
            - primary
            - ci
    - ports:
      - port: 53
        protocol: UDP
      to:
      - ipBlock:
          cidr: 10.0.0.0/8

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-health-tls
  namespace: envoy-gateway-system
spec:
  secretName: public-health-tls
  dnsNames:
    - "gateway-health.example.com"
  privateKey:
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-origin-ca

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: public-tls
  namespace: envoy-gateway-system
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  tls:
    minVersion: "1.3"
    maxVersion: "1.3"

---
# Source: gateway-fleet/templates/class.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal-config
  namespace: envoy-gateway-system
spec:
  filterOrder:
  - before: envoy.filters.http.jwt_authn
    name: envoy.filters.http.ext_authz
  mergeGateways: true
  provider:
    kubernetes:
      envoyDeployment:
        pod:
          tolerations:
          - key: example.com/pool
            operator: Exists
          topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: envoy
                gateway.envoyproxy.io/owning-gatewayclass: internal
            matchLabelKeys:
            - pod-template-hash
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
        replicas: 3
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        name: gateway-internal
        type: ClusterIP
    type: Kubernetes
  shutdown:
    drainTimeout: 60s
    healthCheckFailureDelay: 10s
    minDrainDuration: 30s
  telemetry:
    accessLog:
      settings:
      - format:
          json:
            :authority: '%REQ(:AUTHORITY)%'
            bytes_received: '%BYTES_RECEIVED%'
            bytes_sent: '%BYTES_SENT%'
            cf-ray: '%REQ(CF-RAY)%'
            connection_termination_details: '%CONNECTION_TERMINATION_DETAILS%'
            downstream_local_address: '%DOWNSTREAM_LOCAL_ADDRESS%'
            downstream_remote_address: '%DOWNSTREAM_REMOTE_ADDRESS%'
            duration: '%DURATION%'
            method: '%REQ(:METHOD)%'
            origin: '%REQ(ORIGIN)%'
            protocol: '%PROTOCOL%'
            referer: '%REQ_WITHOUT_QUERY(REFERER)%'
            requested_server_name: '%REQUESTED_SERVER_NAME%'
            response_code: '%RESPONSE_CODE%'
            response_code_details: '%RESPONSE_CODE_DETAILS%'
            response_flags: '%RESPONSE_FLAGS%'
            route_name: '%ROUTE_NAME%'
            sec-fetch-mode: '%REQ(SEC-FETCH-MODE)%'
            sec-fetch-site: '%REQ(SEC-FETCH-SITE)%'
            start_time: '%START_TIME%'
            upstream_cluster: '%UPSTREAM_CLUSTER%'
            upstream_host: '%UPSTREAM_HOST%'
            upstream_local_address: '%UPSTREAM_LOCAL_ADDRESS%'
            upstream_transport_failure_reason: '%UPSTREAM_TRANSPORT_FAILURE_REASON%'
            user-agent: '%REQ(USER-AGENT)%'
            x-envoy-origin-path: '%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%'
            x-envoy-upstream-service-time: '%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%'
            x-forwarded-for: '%REQ(X-FORWARDED-FOR)%'
            x-request-id: '%REQ(X-REQUEST-ID)%'
          type: JSON
        sinks:
        - file:
            path: /dev/stdout
          type: File

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
spec:
  gatewayClassName: internal
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "gateway-health.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: public-health-tls
      allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Same

---
# Source: gateway-fleet/templates/class.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: internal
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: internal-config
    namespace: envoy-gateway-system
