---
# Source: gateway-fleet/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-public
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "65"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
      gateway.envoyproxy.io/owning-gatewayclass: internal
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
      - ipBlock:
          cidr: 10.0.0.0/8
      ports:
      - port: 10443
        protocol: TCP
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: vmagent
      ports:
      - port: 19001
        protocol: TCP
  egress:
    # xDS to the controller. Structural: without it the proxies never receive
    # a configuration and the exposure is dark, whatever else is allowed.
    - to:
        - podSelector:
            matchLabels:
              control-plane: envoy-gateway
      ports:
        - port: 18000
          protocol: TCP

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-health-tls
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "65"
spec:
  secretName: public-health-tls
  dnsNames:
    - "gateway-health.example.com"
  privateKey:
    rotationPolicy: Always
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: example-ca

---
# Source: gateway-fleet/templates/class.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: edge-config
  namespace: edge-system
  annotations:
    example.com/sync-wave: "65"
spec:
  mergeGateways: true
  provider:
    kubernetes:
      envoyDeployment:
        replicas: 3
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        name: gateway-edge
        type: ClusterIP
    type: Kubernetes

---
# Source: gateway-fleet/templates/class.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: internal-config
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "65"
spec:
  mergeGateways: true
  provider:
    kubernetes:
      envoyDeployment:
        replicas: 3
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        name: gateway-internal
        type: ClusterIP
    type: Kubernetes

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "65"
spec:
  gatewayClassName: internal
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "gateway-health.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: public-health-tls
      allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Same

