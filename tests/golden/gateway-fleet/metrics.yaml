---
# Source: gateway-fleet/templates/podmonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-proxy
  namespace: edge-system
  labels:
    release: example
  annotations:
    example.com/sync-wave: "65"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
      app.kubernetes.io/managed-by: envoy-gateway
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
      metricRelabelings:
        - action: keep
          regex: envoy_cluster_upstream_rq_(xx|total|time_(bucket|sum|count))|envoy_cluster_membership_(total|healthy|excluded|degraded)|envoy_cluster_upstream_cx_(total|active|tx_bytes_total|rx_bytes_total)|envoy_cluster_outlier_detection_ejections_active|envoy_http_downstream_rq_(total|xx|time_(bucket|sum|count))|envoy_http_downstream_cx_(total|tx_bytes_total|rx_bytes_total)|envoy_listener_(downstream_cx_active|ssl_certificate_expiration_unix_time_seconds)|envoy_tcp_downstream_cx_(total|tx_bytes_total|rx_bytes_total)|envoy_tls_certificate_.*|envoy_server_(uptime|memory_heap_size|memory_allocated|live)
          sourceLabels:
          - __name__
        - action: labeldrop
          regex: envoy_response_code_class

