---
# Source: gateway-fleet/templates/controller-networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: envoy-gateway
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "65"
spec:
  podSelector:
    matchLabels:
      control-plane: envoy-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # xDS from the proxies.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: envoy
      ports:
        - port: 18000
          protocol: TCP
    # The API server's calls to the validating webhook.
    - from:
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - port: 9443
          protocol: TCP
    # The metrics scraper (metrics.networkPolicy.from).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 19001
          protocol: TCP
  egress:
    # The API server.
    - to:
        - ipBlock:
            cidr: 10.0.0.0/16
        - ipBlock:
            cidr: 10.96.0.0/16
      ports:
        - port: 443
          protocol: TCP
    # Cluster DNS.
    - to:
        - ipBlock:
            cidr: 10.96.0.0/16
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

