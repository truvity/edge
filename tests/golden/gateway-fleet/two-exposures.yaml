# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "65"
spec:
  gatewayClassName: internal
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: private-proxy
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "gateway-health.internal.example"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: private-health-tls
      allowedRoutes:
        kinds:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
        namespaces:
          from: Same

