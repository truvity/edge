---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: private-proxy
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "65"
spec:
  backendTLS:
    clientCertificateRef:
      kind: Secret
      name: gateway-client-cert
  provider:
    kubernetes:
      envoyDeployment:
        replicas: 3
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        annotations:
          example.com/load-balancer-scheme: internal
        loadBalancerClass: example.com/network-load-balancer
        loadBalancerSourceRanges:
        - 10.0.0.0/14
        name: gateway-private
        patch:
          type: StrategicMerge
          value:
            spec:
              clusterIP: 10.0.0.60
        type: LoadBalancer
    type: Kubernetes
  shutdown:
    healthCheckFailureDelay: 5s

---
# Source: gateway-fleet/templates/exposure.yaml
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: public-proxy
  namespace: envoy-gateway-system
  annotations:
    example.com/sync-wave: "65"
spec:
  filterOrder:
  - before: envoy.filters.http.jwt_authn
    name: envoy.filters.http.ext_authz
  provider:
    kubernetes:
      envoyDeployment:
        pod:
          topologySpreadConstraints:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: envoy
            maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
        replicas: 3
      envoyPDB:
        maxUnavailable: 1
      envoyService:
        name: gateway-public
        type: ClusterIP
    type: Kubernetes
  shutdown:
    healthCheckFailureDelay: 5s
    minDrainDuration: 10s

