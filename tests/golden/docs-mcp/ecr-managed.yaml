# Source: docs-mcp/templates/httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arch-mcp
  namespace: default
  labels:
    app.kubernetes.io/name: docs-mcp
    app.kubernetes.io/instance: docs-mcp
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: mcp
      namespace: gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      timeouts:
        request: 0s
      backendRefs:
        - group: ""
          kind: Service
          name: arch-mcp
          port: 8080
          weight: 1
    - matches:
        - path:
            type: PathPrefix
            value: /.well-known/oauth-protected-resource/mcp
      timeouts:
        request: 0s
      backendRefs:
        - group: ""
          kind: Service
          name: arch-mcp
          port: 8080
          weight: 1
    - matches:
        - path:
            type: Exact
            value: /.well-known/oauth-protected-resource
      timeouts:
        request: 0s
      backendRefs:
        - group: ""
          kind: Service
          name: arch-mcp
          port: 8080
          weight: 1
