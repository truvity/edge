apiVersion: v1
kind: Service
metadata:
  name: arch-mcp
  namespace: default
  labels:
    app.kubernetes.io/name: docs-mcp
    app.kubernetes.io/instance: docs-mcp
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: docs-mcp
    app.kubernetes.io/instance: docs-mcp
  # The proxy's port and no other: nothing else of the pod is reachable
  # through the Service.
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

