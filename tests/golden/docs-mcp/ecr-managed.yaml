# Source: docs-mcp/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arch-mcp
  namespace: default
  labels:
    app.kubernetes.io/name: docs-mcp
    app.kubernetes.io/instance: docs-mcp
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  # A rollout never takes a pod away before its replacement is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: docs-mcp
      app.kubernetes.io/instance: docs-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs-mcp
        app.kubernetes.io/instance: docs-mcp
    spec:
      serviceAccountName: arch-mcp
      # Never the ServiceAccount token: Pod Identity and IRSA project the token
      # they need themselves, and the sidecar, which checks the callers' tokens,
      # has no use for a token that speaks for the pod.
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      # Replicas spread over zones and nodes, so one node or zone going away
      # does not take the server with it. Soft (ScheduleAnyway): a small
      # estate still schedules.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: docs-mcp
              app.kubernetes.io/instance: docs-mcp
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: docs-mcp
              app.kubernetes.io/instance: docs-mcp
      # Pod Security Standard "restricted": non-root, a seccomp profile, no
      # privilege escalation and no capabilities on every container.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        # The server. Loopback only for MCP: it declares no container port for
        # it, and holds no authentication code. Its ops port serves the
        # kubelet's probes and /metrics, nothing of the MCP surface.
        - name: docs-mcp
          image: "ghcr.io/truvity/edge/docs-mcp:0.0.0"
          imagePullPolicy: IfNotPresent
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: DOCS_MCP_ADDR
              value: "127.0.0.1:8081"
            - name: DOCS_MCP_OPS_ADDR
              value: ":9090"
            - name: DOCS_MCP_ALLOWED_HOSTS
              value: "docs.example.com,127.0.0.1,localhost"
            - name: DOCS_MCP_ARTIFACT_REF
              value: "registry.example.com/docs/pack"
            - name: DOCS_MCP_ARTIFACT_DIGEST
              value: "sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
            - name: DOCS_MCP_CONTENT_DIR
              value: /var/run/pack
            - name: DOCS_MCP_PLAIN_HTTP
              value: "false"
            - name: DOCS_MCP_MAX_BYTES
              value: "67108864"
            - name: DOCS_MCP_MAX_RESPONSE_BYTES
              value: "131072"
            - name: DOCS_MCP_MAX_CONCURRENT_CALLS
              value: "16"
            - name: DOCS_MCP_LOG_LEVEL
              value: "info"
            - name: DOCS_MCP_REGISTRY_AUTH
              value: "ecr"
          ports:
            - name: ops
              containerPort: 9090
              protocol: TCP
          # The pack is pulled before the MCP port opens; startup allows for
          # a slow registry without loosening liveness.
          startupProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /var/run/pack
        # The resource-proxy: the pod's only MCP port. It checks the bearer
        # token, writes the audit line and forwards to docs-mcp on loopback.
        # No OUTBOUND_*: the server has no backend, so nothing is exchanged.
        - name: proxy
          image: "ghcr.io/truvity/sluis/resource-proxy:v1.0.0@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: LISTEN
              value: ":8080"
            - name: UPSTREAM
              value: "http://127.0.0.1:8081/mcp"
            - name: ISSUER_URL
              value: "https://issuer.example.com"
            - name: RESOURCE_URL
              value: "https://docs.example.com/mcp"
            - name: SCOPE
              value: "openid"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            limits:
              memory: 96Mi
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: content
          emptyDir:
            medium: Memory
            sizeLimit: "256Mi"

