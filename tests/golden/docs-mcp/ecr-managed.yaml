# Source: docs-mcp/templates/networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arch-mcp
  namespace: default
  labels:
    app.kubernetes.io/name: docs-mcp
    app.kubernetes.io/instance: docs-mcp
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: docs-mcp
      app.kubernetes.io/instance: docs-mcp
  policyTypes: [Ingress, Egress]
  ingress:
    # The gateway, on the proxy's one MCP port.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS. With no `networkPolicy.egress.dns` peers this is port 53 to ANY
    # destination: the cluster resolver is not a kube-system pod on every
    # cluster, and a rule naming one namespace blocks DNS where it is not.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # HTTPS: the issuer (signing keys) and the registry of the pack.
    - ports:
        - port: 443
          protocol: TCP
    - ports:
      - port: 80
        protocol: TCP
      to:
      - ipBlock:
          cidr: 169.254.170.23/32

