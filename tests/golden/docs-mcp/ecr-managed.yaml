apiVersion: batch/v1
kind: Job
metadata:
  name: docs-mcp-docs-mcp-identity-check
  labels:
    app.kubernetes.io/name: docs-mcp-identity-check
    app.kubernetes.io/instance: docs-mcp
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/component: docs-mcp-identity-check
    service-lib.io/identity-check: "true"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: docs-mcp-identity-check
        app.kubernetes.io/instance: docs-mcp
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/version: "0.0.0"
        app.kubernetes.io/component: docs-mcp-identity-check
        service-lib.io/identity-check: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: arch-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: identity-check
          image: ghcr.io/truvity/k8s/identity-check@sha256:9fc40a066f5455eb807f0826f7083b0ead46924956af3c8ed5e2c381233d1a38
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
