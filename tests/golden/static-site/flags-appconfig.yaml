---
# Source: static-site/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-site
  namespace: default
  labels:
    app.kubernetes.io/name: static-site
    app.kubernetes.io/instance: static-site
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: static-site
      app.kubernetes.io/instance: static-site
  template:
    metadata:
      labels:
        app.kubernetes.io/name: static-site
        app.kubernetes.io/instance: static-site
      annotations:
        checksum/placeholders: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a
        checksum/flags: 853a68a87882d45ad5ce39c37f85f1f51873b4aa20cf583c69340da44a3c2223
    spec:
      serviceAccountName: static-site
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: static-site
          image: "ghcr.io/truvity/edge/static-site:0.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: STATIC_SITE_ARTIFACT_REF
              value: "registry.example.com/static/www"
            - name: STATIC_SITE_ARTIFACT_DIGEST
              value: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
            - name: STATIC_SITE_CONTENT_DIR
              value: /var/run/site
            - name: STATIC_SITE_PLAIN_HTTP
              value: "false"
            - name: STATIC_SITE_SPA_FALLBACK
              value: "false"
            - name: STATIC_SITE_NOT_FOUND_PAGE
              value: "404.html"
            - name: STATIC_SITE_MAX_BYTES
              value: "536870912"
            - name: STATIC_SITE_MAX_FILES
              value: "50000"
            - name: STATIC_SITE_HTML_MAX_AGE
              value: "60s"
            - name: STATIC_SITE_STALE_WHILE_REVALIDATE
              value: "300s"
            - name: STATIC_SITE_LIVE_DIR
              value: /var/run/live
            - name: STATIC_SITE_LIVE_FILES
              value: "flags.json"
            - name: STATIC_SITE_LIVE_INTERVAL
              value: "5s"
            - name: STATIC_SITE_LIVE_MAX_BYTES
              value: "65536"
            - name: STATIC_SITE_LOG_LEVEL
              value: "info"
            - name: STATIC_SITE_REGISTRY_AUTH
              value: "ecr"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: ops
              containerPort: 8081
              protocol: TCP
          # The artifact is pulled before the site port opens; startup
          # allows for a slow registry without loosening liveness.
          startupProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 2
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /healthz
              port: ops
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: ops
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 25m
              memory: 64Mi
          volumeMounts:
            - name: content
              mountPath: /var/run/site
            - name: live
              mountPath: /var/run/live
              readOnly: true
        # The writer of the flags file: the AWS AppConfig Agent polls one
        # configuration and writes it to the live volume. It reads its
        # manifest once, at start. Nothing calls its own HTTP server, which
        # stays on the pod's loopback.
        - name: appconfig-agent
          image: public.ecr.aws/aws-appconfig/aws-appconfig-agent:2.0.250954@sha256:7828c07dca6fdffcfc24784bdd56e5ee17e452beff6e643ee03f2a13ce2ff1c8
          imagePullPolicy: IfNotPresent
          env:
            - name: SERVICE_REGION
              value: "eu-central-1"
            - name: MANIFEST
              value: file:/etc/appconfig-agent/manifest.json
            - name: PREFETCH_LIST
              value: "shop-web:globex:flags"
            - name: POLL_INTERVAL
              value: "15"
            - name: HTTP_HOST
              value: localhost
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          volumeMounts:
            - name: live
              mountPath: /var/run/live
            - name: flags-manifest
              mountPath: /etc/appconfig-agent
              readOnly: true
      volumes:
        - name: content
          emptyDir:
            medium: Memory
            sizeLimit: "1Gi"
        - name: flags-manifest
          configMap:
            name: static-site-flags
        - name: live
          emptyDir:
            medium: Memory
            sizeLimit: "1Mi"
