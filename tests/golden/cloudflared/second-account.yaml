---
# Source: cloudflared/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared-partner
  namespace: cloudflare-system
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: cloudflared-partner
    app.kubernetes.io/component: tunnel
    app.kubernetes.io/version: "0.0.0"
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/instance: cloudflared-partner
      app.kubernetes.io/component: tunnel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: cloudflared-partner
        app.kubernetes.io/component: tunnel
    spec:
      serviceAccountName: cloudflared-partner
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "cloudflare/cloudflared:2026.10.0"
          imagePullPolicy: IfNotPresent
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /secrets/tunnel-token
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: 
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tunnel-token
              mountPath: /secrets
              readOnly: true
            - name: origin-ca
              mountPath: /etc/cloudflared/certs
              readOnly: true
      volumes:
        - name: tunnel-token
          secret:
            secretName: cloudflared-partner-token
        # Origin CA root (public cert). The remote tunnel config's
        # originRequest.caPool references /etc/cloudflared/certs/ca.pem,
        # so this mount must exist BEFORE the tunnel config stops using
        # noTLSVerify.
        - name: origin-ca
          secret:
            secretName: cloudflared-partner-origin-ca
