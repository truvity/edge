# The platform lists the actions an extra statement may name; the statement
# here stays inside the list, so the policy is the one of extra-statements.
registry:
  auth: ecr
  ack:
    enabled: true
    clusterName: example
    repositoryArns:
      - arn:aws:ecr:eu-central-1:123456789012:repository/example
    allowedExtraActions:
      - appconfig:StartConfigurationSession
      - appconfig:GetLatestConfiguration
    extraStatements:
      - Sid: ReadFlags
        Effect: Allow
        Action:
          - appconfig:StartConfigurationSession
          - appconfig:GetLatestConfiguration
        Resource:
          - arn:aws:appconfig:eu-central-1:123456789012:application/abc1234/environment/def5678/configuration/ghi9012
serviceAccount:
  name: static-site
