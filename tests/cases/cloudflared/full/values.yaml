# Every optional knob on: origin CA verification, arch-pinned scheduling,
# zone spread, PDB, extra args.
caSecretName: cloudflared-origin-ca
extraArgs: ["--protocol", "quic"]
nodeSelector:
  kubernetes.io/arch: arm64
tolerations:
  - key: arch
    operator: Exists
# A constraint of the caller's own comes first, then the chart's zone spread.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: cloudflared
zoneSpread: DoNotSchedule
podDisruptionBudget:
  maxUnavailable: 2
podAnnotations:
  example.com/checksum: abc
priorityClassName: system-cluster-critical
serviceAccount:
  annotations:
    example.com/role: tunnel
