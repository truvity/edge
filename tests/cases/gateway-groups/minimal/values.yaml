# One group, one domain: a project's hostname on a shared exposure.
defaults:
  parent:
    name: public
  certificate:
    issuerRef:
      name: example-ca
      kind: ClusterIssuer
      group: cert-manager.io

groups:
  umbrella-corp:
    domains:
      - umbrella-corp.example.com
    allowedRoutes:
      namespaces:
        from: Selector
        selector:
          matchLabels:
            gateway.example.com/route-grant-umbrella-corp: "true"
