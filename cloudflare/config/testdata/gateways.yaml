# The edge catalog the cloudflare.yaml fixture derives its tunnels from.
version: 1
exposures:
  public:
    class: internal
    arrival: cloudflare-tunnel
    cloudflare_accounts: [main, partner]
    clusters:
      kernel:
        groups:
          portal: {domains: [example.com], route_namespaces: [portal]}
          access: {domains: [access.example.com], route_namespaces: [access]}
          alert-ingress: {domains: [alert-ingress.example.com, alertmanager.example.com], route_namespaces: [monitoring]}
          argocd: {domains: [argocd.example.com], route_namespaces: [argocd]}
          grafana: {domains: [grafana.example.com, mcp.example.com], route_namespaces: [monitoring]}
          headlamp: {domains: [headlamp.kernel.example.com], route_namespaces: [headlamp]}
          otlp: {domains: [otlp.example.com], route_namespaces: [monitoring]}
      devel:
        groups:
          acme: {domains: [acme.devel.example.com], route_namespaces: [acme]}
          globex:
            domains:
              - globex.devel.example.com
              - {host: '*.globex.devel.example.com', waf: off, waf_reason: per-install names; the exact ones are listed by their own domains}
            route_namespaces: [globex]
          headlamp: {domains: [headlamp.devel.example.com], route_namespaces: [headlamp]}
          otlp: {domains: [otlp.devel.example.com], route_namespaces: [monitoring]}
          umbrella: {domains: [umbrella-corp.devel.example.com], route_namespaces: [umbrella-corp]}
          gemaal: {domains: [gemaal.example.com], route_namespaces: [gemaal]}
          catch-all:
            domains:
              - {host: '*.devel.example.com', waf: off, waf_reason: catch-all wildcard; exact names are covered by the groups that serve them}
            route_namespaces: [platform]
          legacy:
            domains:
              - {host: old.devel.example.com, dns_elsewhere: true}
            route_namespaces: [legacy]
          landing: {domains: [landing.devel.example.net], route_namespaces: [landing]}
      stage:
        groups:
          acme: {domains: [acme.stage.example.com, ssi.example.org], route_namespaces: [acme]}
          globex: {domains: [globex.stage.example.com], route_namespaces: [globex]}
          headlamp: {domains: [headlamp.stage.example.com], route_namespaces: [headlamp]}
          umbrella: {domains: [umbrella-corp.stage.example.com], route_namespaces: [umbrella-corp]}
          landing: {domains: [landing.stage.example.net], route_namespaces: [landing]}
      prod:
        groups:
          acme: {domains: [acme.prod.example.com], route_namespaces: [acme]}
          globex: {domains: [globex.prod.example.com], route_namespaces: [globex]}
          headlamp: {domains: [headlamp.prod.example.com], route_namespaces: [headlamp]}
          umbrella: {domains: [umbrella-corp.prod.example.com], route_namespaces: [umbrella-corp]}
          landing: {domains: [landing.prod.example.net], route_namespaces: [landing]}
  private:
    class: internal
    arrival: private-clusterip
    clusters:
      kernel:
        groups:
          vault: {domains: [vault.kernel.example.internal], route_namespaces: [vault]}
