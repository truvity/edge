name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@f0f75f715a4feef8ab1e4e6222e84708bb32f6cd # v5.5.0
    with:
      recipes: '["vuln"]'
      # 26.04 hosted runners kill heavy Go jobs, so drop this pin once 26.04 is stable.
      runner: ubuntu-24.04
