name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@7b22e3d5faa86a935b8a737f52a0d49f91f705cc # v5.6.3
    with:
      recipes: '["vuln"]'
      # 26.04 hosted runners kill heavy Go jobs, so drop this pin once 26.04 is stable.
      runner: ubuntu-24.04
