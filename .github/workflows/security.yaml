name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@32deafafdd283883ae3d8211ce25105be0f588a6 # v5.8.1
    with:
      recipes: '["vuln"]'
      # 26.04 hosted runners kill heavy Go jobs, so drop this pin once 26.04 is stable.
      runner: ubuntu-24.04
