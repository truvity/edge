name: Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 6 * * *" # daily 6am UTC

permissions:
  contents: read

jobs:
  govulncheck:
    uses: truvity/ci-workflows/.github/workflows/check.yaml@81bc1cd3003294d9bdc0f141956a432b8b33d423 # v5.13.0
    with:
      recipes: '["vuln"]'
      # 26.04 hosted runners kill heavy Go jobs, so drop this pin once 26.04 is stable.
      runner: ubuntu-24.04
