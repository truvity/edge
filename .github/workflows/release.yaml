# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# goreleaser makes the GitHub Release and builds the static-site image
# (see .goreleaser.yaml);
# every chart listed below is packaged at the tag's version and pushed to
# oci://ghcr.io/truvity/charts/<chart>.
#
# The caller grants the permissions because a reusable workflow can
# narrow them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse
# than a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@d4350d573f67de8f7a145a4de94c392c6b43fd8c # v5.0.0
    with:
      charts: '["cloudflared", "gateway-fleet", "gateway-groups", "gateway-policies", "gateway-projects", "gateway-routes", "static-site", "static-site-infra"]'
      # The static-site server image: goreleaser's ko section pushes it to
      # <ko-docker-repo>/static-site at the same tag as the charts.
      ko-docker-repo: ghcr.io/truvity/edge
      # 26.04 hosted runners kill heavy Go jobs, so drop this pin once 26.04 is stable.
      runner: ubuntu-24.04
