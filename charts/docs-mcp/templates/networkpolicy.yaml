{{- if .Values.networkPolicy.enabled }}
{{- /*
The pod admits the gateway on the proxy's port and nothing else (the ops
port only from metricsFrom), and reaches DNS and HTTPS: the issuer's signing
keys and the registry of the pack. extraEgress adds rules, verbatim.
*/}}
{{- $httpsPorts := uniq (list "443" (include "docs-mcp.urlPort" .Values.issuerURL) (include "docs-mcp.registryPort" .)) }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "docs-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docs-mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "docs-mcp.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # The gateway, on the proxy's one MCP port.
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: {{ include "docs-mcp.proxyPort" . }}
          protocol: TCP
    {{- with .Values.networkPolicy.metricsFrom }}
    # Whatever scrapes the metrics, on the ops port only.
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: {{ include "docs-mcp.opsPort" $ }}
          protocol: TCP
    {{- end }}
  egress:
    # DNS. With no `networkPolicy.egress.dns` peers this is port 53 to ANY
    # destination: the cluster resolver is not a kube-system pod on every
    # cluster, and a rule naming one namespace blocks DNS where it is not.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      {{- with .Values.networkPolicy.egress.dns }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    # HTTPS: the issuer (signing keys) and the registry of the pack.
    - ports:
        {{- range $p := $httpsPorts }}
        - port: {{ $p }}
          protocol: TCP
        {{- end }}
      {{- with .Values.networkPolicy.egress.https }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
