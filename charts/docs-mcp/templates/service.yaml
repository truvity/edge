apiVersion: v1
kind: Service
metadata:
  name: {{ include "docs-mcp.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docs-mcp.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "docs-mcp.selectorLabels" . | nindent 4 }}
  # The proxy's port and no other: nothing else of the pod is reachable
  # through the Service.
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
