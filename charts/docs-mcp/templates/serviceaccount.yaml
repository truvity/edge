{{- /*
Not rendered when the identity is managed (registry.auth=ecr and
registry.ack.enabled): the account belongs to static-site-infra, rendered
after the Pod Identity association, and this chart only names it.
*/}}
{{- if and .Values.serviceAccount.create (not (include "docs-mcp.identityManaged" .)) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "docs-mcp.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "docs-mcp.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
