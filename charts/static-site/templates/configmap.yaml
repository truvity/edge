{{- if (include "static-site.inlinePlaceholders" . | fromJson) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "static-site.fullname" . }}-placeholders
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
data:
  placeholders.json: |
    {{- include "static-site.placeholders" . | nindent 4 }}
{{- end }}
{{- if .Values.extraFiles }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "static-site.fullname" . }}-extra-files
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.extraFiles }}
  {{ $name }}: {{ $content | quote }}
  {{- end }}
{{- end }}
{{- if include "static-site.flagsOn" . }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "static-site.fullname" . }}-flags
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "static-site.labels" . | nindent 4 }}
data:
  manifest.json: {{ include "static-site.flagsManifest" . | quote }}
{{- end }}
