# static-site: one generic server, one site per install.

nameOverride: ""
fullnameOverride: ""

replicaCount: 2

# The server image. The tag defaults to the chart's appVersion, which the
# release stamps with the release version: chart and image never disagree.
image:
  repository: ghcr.io/truvity/edge/static-site
  tag: ""
  # Optional pin; renders repository:tag@digest.
  digest: ""
  pullPolicy: IfNotPresent
# Other images. identity-check is the pre-install/pre-upgrade hook that proves
# a pod admitted now has its cloud identity (truvity/k8s cmd/identity-check),
# rendered when registry.auth=ecr and registry.ack.enabled.
images:
  identity-check:
    registry: ghcr.io
    repository: truvity/k8s/identity-check
    tag: 0.34.0
    digest: sha256:9fc40a066f5455eb807f0826f7083b0ead46924956af3c8ed5e2c381233d1a38

# Secrets for pulling the SERVER image (not the site artifact).
imagePullSecrets: []

site:
  artifact:
    # registry/repository[:tag] of the site artifact, e.g.
    # registry.example.com/static/www. The default is a placeholder that
    # serves nothing: set it.
    ref: registry.example.com/static/site
    # sha256:<64 hex>. When set it wins over any tag in ref and pins the pull.
    # An independent value so that a promotion tool can write it alone.
    digest: ""
  # registry.auth=dockerconfig only: name of a kubernetes.io/dockerconfigjson
  # Secret holding the registry credentials for the artifact. Empty for an
  # anonymous registry.
  pullSecretName: ""
  # Talk plain HTTP to the registry (an in-cluster dev registry only).
  plainHTTP: false
  # Serve /index.html for extensionless paths that match no file.
  spaFallback: false
  # Page served with a 404 (path inside the site); empty for a plain 404.
  notFoundPage: 404.html
  # Refuse an artifact larger than this many bytes / with more files.
  maxBytes: 536870912
  maxFiles: 50000
  # Size of the memory-backed volume the artifact is unpacked into. Reloading
  # holds the old and the new copy at once, so allow for two.
  contentSizeLimit: 1Gi

# How the server authenticates to the registry of the artifact.
#  dockerconfig  the Docker config file of site.pullSecretName; none when that
#                is empty. The default, and the behaviour before this key.
#  ecr           the server calls ecr:GetAuthorizationToken itself with the AWS
#                SDK default credential chain: EKS Pod Identity, or IRSA
#                through serviceAccount.annotations["eks.amazonaws.com/role-arn"].
#                No pull-secret volume; the ServiceAccount token is mounted.
#  none          anonymous. See docs/static-site.md.
registry:
  auth: dockerconfig
  # The ServiceAccount's AWS identity on EKS (needs registry.auth=ecr) is the
  # static-site-infra chart's: an IAM Policy, an IAM Role trusting EKS Pod
  # Identity, a PodIdentityAssociation, then the ServiceAccount. With
  # ack.enabled this chart renders none of them, and no ServiceAccount: it
  # names serviceAccount.name (default: the fullname) and renders the identity
  # check hook, which fails until a pod admitted now has the identity. Install
  # static-site-infra first. The other keys of ack are static-site-infra's
  # (the same keys, so one set of values feeds both); this chart reads
  # `enabled` and `accountId` alone. IRSA (non-EKS) stays serviceAccount.annotations.
  ack:
    enabled: false
    # Optional, also read here: the AWS account the identity check hook expects
    # the pod to run in (`-expect-account`; 12 digits, quoted). Unset, the hook
    # checks the role alone. In static-site-infra it pins the trust (with region).
    accountId: ""
    # Read by static-site-infra, ignored here:
    # EKS cluster the association is in. Required when enabled.
    clusterName: ""
    # ECR repository ARNs the artifact is pulled from (may be in another
    # account: the repository policy there must admit the role). Required.
    repositoryArns: []
    # Name of the IAM Role and Policy. Default <clusterName>-<namespace>-<release>.
    rolePrefix: ""
    # Optional: pin the trust to the cluster's account and ARN (both needed;
    # accountId is declared above).
    region: ""
    # Tags on the Role. `cluster` is always set; put `project: <name>` here:
    # the ACK project role confines on aws:ResourceTag/project.
    tags: {}
    # ARN of the role's permissions boundary.
    permissionsBoundary: ""

# Serve-time placeholders: {{ name }} in html, js, css and json files is
# replaced by the value, for the names provided here and no others. Static
# sites are built once and the same bytes run in every environment; the
# per-environment values arrive here.
#
# Two sources, which may be combined:
#  - inline: every key except the three below is a name and its value. These
#    values are NOT secret (they land in public pages) and may use only
#    A-Za-z0-9 ._:/@#+=,~-
#  - a Secret: `secretName` is mounted read-only, one file per key. The chart
#    never creates it (an ExternalSecret does; see
#    docs/static-site.md) or, with `externalSecret` below, the chart does.
#    `secretKeys` lists the names the server expects
#    from it, `optionalKeys` the names that may be absent (served as empty).
#    With a Secret the server runs strict: a {{ token }} in the content that
#    is unknown, or declared but without a value, fails the load.
#    Nothing is rendered for the Secret while secretName is empty.
#  - externalSecret (optional, unset by default): renders the ExternalSecret
#    that fills the Secret, so the estate passes only names. `properties`
#    maps each Secret key to its property under `remoteKey` in the store, and
#    its keys must equal secretKeys plus optionalKeys (the render fails
#    otherwise). Needs secretName. The ExternalSecret carries the Argo CD
#    annotation ignore-healthcheck (ignoreHealthcheck: true) so that a value
#    nobody has written yet does not hold the application Degraded;
#    `annotations` adds more.
placeholders: {}
  # gtmId: GTM-XXXXXXX
  # secretName: static-site-values
  # secretKeys: [gtmId]
  # optionalKeys: []
  # externalSecret:
  #   storeRef: {kind: ClusterSecretStore, name: example-store}
  #   remoteKey: static-sites/docs.example/placeholders
  #   properties: {gtmId: gtm-id}
  #   refreshInterval: 1h
  #   ignoreHealthcheck: true
  #   annotations: {}

cache:
  # File names matching this regexp are served immutable for a year. Empty
  # keeps the server's default (a dot, dash or underscore, 8+ hex digits,
  # then the extension: app.3f9a1c2b.js).
  hashedPattern: ""
  # Everything else, HTML included.
  htmlMaxAge: 60s
  staleWhileRevalidate: 300s

# Response headers added to every response, over the defaults (nosniff,
# X-Frame-Options DENY, a strict-origin-when-cross-origin referrer policy).
# An empty value removes a default.
headers: {}
  # Content-Security-Policy: "default-src 'self'"

logLevel: info

service:
  type: ClusterIP
  port: 80
  annotations: {}

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi

terminationGracePeriodSeconds: 40

# With registry.auth=ecr this is the identity the cluster binds AWS
# credentials to. Pod Identity needs a stable name and no annotation; IRSA
# needs annotations: {eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/example}.
serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Ingress to the site port from `ingressFrom` (NetworkPolicyPeer list; empty
# means any source) and to the ops port from `metricsFrom`; egress to DNS and
# to HTTPS (the registry). `extraEgress` adds rules.
networkPolicy:
  enabled: false
  ingressFrom: []
  metricsFrom: []
  extraEgress: []
