apiVersion: v2
name: static-site
description: >-
  A generic static-site server: pulls one OCI artifact (a built site) by
  digest, serves it with CDN-friendly caching and allowlisted serve-time
  placeholders. The site is a value, the server is the same for every site.
type: application
# Placeholder: the git tag is the sole version authority. The release
# workflow stamps both fields from the tag (truvity/ci-workflows
# release-public.yaml). appVersion is the default image tag, so the chart and
# the server image it runs are always the same release.
version: 0.0.0
appVersion: 0.0.0
# The pod's cloud identity check comes from the platform's library chart
# (rule 11 of the platform contract). It is rendered only for registry.auth=ecr
# with registry.ack.enabled. `helm dependency build` resolves it; the release
# packages with it.
dependencies:
  - name: service-lib
    version: 1.54.0
    repository: oci://ghcr.io/truvity/charts
home: https://github.com/truvity/edge
sources:
  - https://github.com/truvity/edge
keywords:
  - static-site
  - oci
  - oras
maintainers:
  - name: Truvity
    url: https://github.com/truvity
