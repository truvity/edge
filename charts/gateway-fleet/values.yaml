# gateway-fleet — the vendor half of an Envoy Gateway install.
#
# Upstream's gateway-helm chart installs the CONTROLLER. This chart owns the
# plane the controller manages:
#
#   classes.<name>     a GatewayClass and its EnvoyProxy.
#   exposures.<name>   a Gateway — one entry point, such as public or private —
#                      with its health listener, the rule for which ListenerSets
#                      may attach, its baseline ClientTrafficPolicy, its
#                      NetworkPolicy, and (on a split class) its own EnvoyProxy,
#                      which is what gives that exposure its own Service, its
#                      own address and its own failure domain.
#
# Hostnames other than the health endpoint do not belong here: a project group
# attaches to an exposure as a ListenerSet, rendered by the gateway-groups
# chart from the same catalogue row. This chart therefore never grows a list of
# the estate's domains.
#
# Everything particular — issuers, cloud annotations, load-balancer classes,
# source ranges, addresses, DNS — is an input with a neutral default. The
# consuming estate supplies it from its own repository.

# The Envoy Gateway controller's name, as installed by gateway-helm.
controllerName: gateway.envoyproxy.io/gatewayclass-controller

# Annotations on every object this chart renders. An object's own annotations
# override matching keys.
commonAnnotations: {}

# Settings every proxy of the install shares, in the shape of a `proxy` block
# below: merged under each class's and exposure's own `proxy`, which wins.
# `presets/fleet.yaml` sets it for an ext_authz-gated, browser-facing fleet.
proxyDefaults: {}

# ---------------------------------------------------------------------------
# Classes: one GatewayClass, one EnvoyProxy.
# ---------------------------------------------------------------------------
classes: {}
#  internal:
#    enabled: true
#    namespace: envoy-gateway-system
#    annotations: {}
#
#    # false (the default): every Gateway of this class gets its own Envoy
#    # Deployment and Service, so one exposure can carry a pinned address or a
#    # load balancer without the others. true: every Gateway collapses onto one
#    # Deployment and one Service — cheaper, but the exposures then share an
#    # address and a failure domain, and none may set its own proxy.
#    mergeGateways: false
#
#    # The class proxy. On a merged class it is the only proxy. On a split
#    # class it is the fallback for any Gateway with no proxy of its own.
#    proxy:
#      enabled: true
#      name: ""                     # default: <class>-config
#      annotations: {}
#      filterOrder: []              # verbatim EnvoyProxy.spec.filterOrder
#      replicas: 3                  # one per zone in a three-zone cluster
#      podDisruptionBudget:
#        maxUnavailable: 1          # one proxy at a time; 0 or null: no PDB
#        minAvailable: null         # set: rendered INSTEAD of maxUnavailable;
#                                   # 0: no PDB
#      pod:
#        tolerations: []
#        nodeSelector: {}
#        affinity: {}
#        topologySpreadConstraints: []
#        # DoNotSchedule | ScheduleAnyway: one proxy per zone, selected by the
#        # proxy's own pod labels plus matchLabelKeys [pod-template-hash], so
#        # a rolling update spreads the new pods by themselves. Empty renders
#        # no constraint of its own.
#        zoneSpread: ""
#      # A fleet that carries TLS passthrough entries: fills the graceful-drain
#      # defaults (10s / 30s / 60s) wherever `shutdown` leaves them empty.
#      passthrough: false
#      service:
#        name: ""                   # default: gateway-<class>
#        type: ClusterIP
#        clusterIP: ""              # pin an address; "None" for headless
#        annotations: {}
#        labels: {}
#        loadBalancerClass: ""
#        loadBalancerSourceRanges: []
#        externalTrafficPolicy: ""
#        patch: {}                  # {type, value}, merged over the above
#      useListenerPortAsContainerPort: false
#      # Resource requests/limits of the proxy pods' containers. Empty (the
#      # default) renders nothing, so the controller's own defaults apply.
#      container:
#        resources: {}              # the envoy container: {requests, limits}
#      shutdownManager:
#        resources: {}              # the shutdown-manager sidecar
#      shutdown:
#        drainTimeout: ""
#        minDrainDuration: ""
#        # Fail the readiness probe this long before draining starts, so a
#        # load balancer removes the endpoint before it stops accepting.
#        healthCheckFailureDelay: ""
#      backendTLS:
#        # The client certificate Envoy presents to a backend that asks for
#        # one. Pairs with a BackendTLSPolicy on the route's backend.
#        clientCertificateRef:
#          name: ""
#          namespace: ""
#      # Fields added to Envoy Gateway's default JSON access log, as
#      # name: Envoy command operator. Empty (the default) renders no
#      # telemetry, so the controller's default applies unchanged. A JSON
#      # format replaces the default rather than extending it, so the chart
#      # renders the default fields too; a name that matches one overrides it.
#      # %REQ_WITHOUT_QUERY(...)% logs a URL-valued header without its query.
#      accessLog:
#        extraFields: {}
#          # origin: "%REQ(ORIGIN)%"
#          # referer: "%REQ_WITHOUT_QUERY(REFERER)%"
#      extraSpec: {}                # deep-merged over the generated spec last

# ---------------------------------------------------------------------------
# Exposures: one Gateway each.
# ---------------------------------------------------------------------------
exposures: {}
#  public:
#    enabled: true
#    class: internal                # required; must name an enabled class
#    namespace: ""                  # default: the class namespace
#    gatewayName: ""                # default: the map key
#    annotations: {}
#    labels: {}
#
#    # Which ListenerSets may attach. The default admits only the exposure's
#    # own namespace, so a project cannot open a listener by creating an
#    # object in its own namespace.
#    allowedListeners:
#      namespaces:
#        from: Same                 # None | Same | All | Selector
#        # selector:
#        #   matchLabels: {}
#
#    # The exposure's own listener. It exists so the Gateway is never empty:
#    # a Gateway with no listener has no proxies, and the exposure would be
#    # dark until the first group attached.
#    health:
#      listenerName: ""             # default: https or http, from protocol
#      hostname: ""                 # required; exact, never a wildcard
#      port: 443
#      protocol: HTTPS
#      tls:
#        secretName: ""             # default: <gateway>-health-tls
#      certificate:
#        enabled: true
#        name: ""                   # default: the Secret name
#        annotations: {}
#        labels: {}
#        duration: ""
#        renewBefore: ""
#        privateKey:
#          rotationPolicy: Always   # a renewed leaf has a new key
#        usages: []
#        issuerRef:                 # name required when enabled
#          kind: ClusterIssuer
#          group: cert-manager.io
#      allowedRoutes:
#        namespaces:
#          from: Same
#        kinds:
#          - group: gateway.networking.k8s.io
#            kind: HTTPRoute
#      # An answer with no backend behind it, so the exposure can be probed
#      # even when every workload behind it is down.
#      directResponse:
#        enabled: false
#        routeName: ""              # default: <gateway>-health
#        filterName: ""             # default: <gateway>-health
#        annotations: {}
#        labels: {}
#        path: /healthz
#        statusCode: 200
#        contentType: text/plain
#        body: ok
#
#    # The TLS floor for everything this exposure terminates. It targets the
#    # Gateway, so an attached ListenerSet inherits it.
#    clientTrafficPolicy:
#      enabled: false
#      name: ""                     # default: <gateway>-tls
#      annotations: {}
#      labels: {}
#      tls:
#        # false renders no `tls` block: the policy then carries only
#        # clientTraffic.earlyRequestHeaders.remove, and the exposure's TLS
#        # settings stay Envoy Gateway's defaults. Needs a non-empty
#        # remove list (an empty policy is refused).
#        enabled: true
#        minVersion: "1.3"
#        maxVersion: "1.3"
#        # Client certificates. This is what turns an exposure into one that
#        # only a holder of a certificate from the named CA can reach.
#        clientValidation:
#          enabled: false
#          optional: false
#          allowExpiredCertificate: false
#          caCertificateRefs: []    # [{kind: ConfigMap|Secret, name: ...}]
#
#    # This exposure's own proxy. Only a split class (mergeGateways: false)
#    # can have one; the shape is the same as classes.<name>.proxy.
#    proxy: {}
#
#    networkPolicy:
#      enabled: false
#      name: ""                     # default: envoy-<exposure>
#      annotations: {}
#      ingress: []
#      xds:
#        enabled: true
#        controllerPodLabels:
#          control-plane: envoy-gateway
#        port: 18000
#      egress: []
#      # Egress as rows, rendered before `egress`, after the xDS rule. A fleet's
#      # egress is an allow-list and the Gateway API opens none of it: a
#      # backend needs its row as well as its route.
#      egressTo: []
#      #  - namespace: example-ui          # or namespaceExpressions: [...]; "*" = every namespace
#      #    podLabels: {app.kubernetes.io/name: example-ui}   # none: the whole namespace
#      #    port: 8080                      # the POD's port; none: every port
#      #    protocol: TCP
#
#    # Further Services in front of this exposure's proxies, beside the one
#    # Envoy Gateway makes: a pinned ClusterIP, or a load balancer of its own
#    # class. Each selects exactly this exposure's pods. A Service's address
#    # cannot move, so its name is an input, never derived.
#    services: []
#    #  - name: example-entry               # required
#    #    type: ClusterIP                   # or LoadBalancer
#    #    clusterIP: ""                     # pin an address
#    #    annotations: {}                   # e.g. the cloud's load-balancer annotations
#    #    labels: {}
#    #    loadBalancerClass: ""
#    #    loadBalancerSourceRanges: []
#    #    externalTrafficPolicy: ""
#    #    ports: []                         # default: the health listener's port, to
#    #                                      # the proxy's container port (+10000 below 1024)
#
#    # Further egress policies on this exposure's proxies, each its own
#    # object with the chart's pod selector and the caller's rules: an FQDN
#    # rule in a network-policy implementation's own kind, or a pinned
#    # address list beside it.
#    egressPolicies: []
#    #  - name: example-fqdn                # required
#    #    apiVersion: networking.k8s.io/v1  # default; or the implementation's
#    #    kind: NetworkPolicy               # default; or the implementation's
#    #    annotations: {}
#    #    labels: {}
#    #    egress: []                        # required, verbatim

# ---------------------------------------------------------------------------
# TLS passthrough entries: a Gateway of a merged class whose one listener
# forwards the still-encrypted stream, chosen by SNI, to a backend that
# terminates TLS itself, and the TLSRoute that names that backend. The class
# should set proxy.passthrough (graceful drain for long-lived streams).
# ---------------------------------------------------------------------------
passthroughs: {}
#  vault:
#    enabled: true
#    class: internal                # required; an enabled, merged class
#    namespace: vault               # required: where the backend Service is
#    gatewayName: ""                # default: the map key
#    annotations: {}
#    labels: {}
#    listenerName: tls
#    hostname: vault.example.internal   # required; exact
#    port: 443
#    route:
#      name: ""                     # default: gatewayName
#      annotations: {}              # over commonAnnotations: a later sync wave
#      labels: {}
#      backend:
#        name: vault                # required
#        port: 8200                 # required
#        weight: 1

# ---------------------------------------------------------------------------
# The Envoy Gateway controller's own NetworkPolicy. Upstream's chart renders
# none. Off by default, so an existing render is unchanged.
# ---------------------------------------------------------------------------
controllerNetworkPolicy:
  enabled: false
  name: envoy-gateway
  # Where upstream's chart installed the controller.
  namespace: envoy-gateway-system
  annotations: {}
  # The controller's pod labels, as upstream's chart sets them.
  podLabels:
    control-plane: envoy-gateway
  # xDS from the proxies (same namespace).
  xds:
    port: 18000
    proxyPodLabels:
      app.kubernetes.io/name: envoy
  # The API server's calls to the validating webhook. Peers, verbatim
  # (NetworkPolicyPeer). Empty: no rule.
  webhook:
    port: 9443
    from: []
  # The scraper is metrics.networkPolicy.from; this is the controller's port.
  metrics:
    port: 19001
  # Egress to the API server: required when enabled.
  apiServer:
    port: 443
    cidrs: []
  # Egress to the cluster resolver, UDP and TCP 53: peers, verbatim; required
  # when enabled.
  dns:
    to: []
  # Further rules, verbatim, after the chart's.
  ingress: []
  egress: []

# ---------------------------------------------------------------------------
# Client traffic: request headers a client must not choose.
# ---------------------------------------------------------------------------
clientTraffic:
  earlyRequestHeaders:
    # Header names (lowercase) removed from every request before ANY HTTP
    # filter runs, on every ClientTrafficPolicy this chart renders
    # (ClientTrafficPolicy.spec.headers.earlyRequestHeaders.remove).
    #
    # Why: the JWT filter's claimToHeaders ADDS a header; it does not replace
    # one the client sent. A client that supplies the same header ahead of
    # time leaves its own value first, and a backend that reads the first
    # value sees the forgery. List here every header named in any
    # claimToHeaders of the gateway-policies chart (for example
    # x-auth-request-email). Empty (the default) renders no `headers` block.
    #
    # Needs an exposure with clientTrafficPolicy.enabled: true; the render
    # fails for an enabled exposure without one, since its headers would
    # otherwise go unstripped in silence. Pseudo-headers and headers whose
    # removal would break traffic (host, content-length, transfer-encoding,
    # cookie, authorization, ...) are refused.
    remove: []
    #  - x-auth-request-email
    #  - x-auth-request-user

  # Connection lifetime on the same ClientTrafficPolicy. Each key is omitted
  # from the render when unset, so an existing render is unchanged.
  #
  # Why: a long-lived client (cloudflared) keeps its keep-alive connections on
  # an Envoy filter chain that a ListenerSet move has drained, and gets 404
  # until it reconnects. Capping the connection age makes it reconnect within
  # the cap whatever order the move was synced in. HTTP/2 streams are cut at
  # the cap. Durations are Gateway API durations (for example 5m, 1h30m).
  connection:
    # ClientTrafficPolicy.spec.connection.connectionLimit.maxConnectionDuration
    maxConnectionDuration: ""
  # ClientTrafficPolicy.spec.timeout.http.idleTimeout (Envoy default: 1h).
  idleTimeout: ""
  http1:
    # ClientTrafficPolicy.spec.http1.disableSafeMaxConnectionDuration. Unset
    # (null) renders nothing. true closes an HTTP/1 connection shortly after
    # the cap instead of at the next request; no effect without
    # connection.maxConnectionDuration.
    disableSafeMaxConnectionDuration: null

# ---------------------------------------------------------------------------
# Metrics: scraping the fleet. Off by default, so an existing render is
# unchanged.
# ---------------------------------------------------------------------------
metrics:
  podMonitor:
    # Render PodMonitors (monitoring.coreos.com/v1) for the proxies and the
    # controller. The CRD must exist; the chart does not check.
    enabled: false
    interval: ""                   # empty: the scraper's own default
    labels: {}                     # on every PodMonitor, e.g. a selector label
    annotations: {}                # merged over commonAnnotations

    proxy:
      enabled: true
      name: envoy-proxy
      port: metrics                # the proxy's stats port (19001)
      path: /stats/prometheus
      # Envoy exports a stat family per upstream cluster, and a merged
      # fleet has one cluster per routed backend, so an unfiltered scrape
      # is the largest on an estate. These are the families read by Envoy
      # Gateway's own dashboards (envoy-proxy-global and envoy-clusters,
      # gateway v1.9.2). Each entry is a regex over the whole metric name;
      # the entries are joined into one `keep` rule. An EMPTY list keeps
      # every series. Setting the key replaces this list, it does not extend it.
      keep:
        - envoy_cluster_upstream_rq_(xx|total|time_(bucket|sum|count))
        - envoy_cluster_membership_(total|healthy|excluded|degraded)
        - envoy_cluster_upstream_cx_(total|active|tx_bytes_total|rx_bytes_total)
        - envoy_cluster_outlier_detection_ejections_active
        - envoy_http_downstream_rq_(total|xx|time_(bucket|sum|count))
        - envoy_http_downstream_cx_(total|tx_bytes_total|rx_bytes_total)
        - envoy_listener_(downstream_cx_active|ssl_certificate_expiration_unix_time_seconds)
        - envoy_tcp_downstream_cx_(total|tx_bytes_total|rx_bytes_total)
        - envoy_tls_certificate_.*
        - envoy_server_(uptime|memory_heap_size|memory_allocated|live)
      # Further rules, appended after the keep rule, verbatim. Each MUST
      # write `action` (the render fails otherwise).
      metricRelabelings: []

    # The Envoy Gateway controller, installed by upstream's chart. The
    # defaults are that chart's own namespace, labels and metrics port.
    controller:
      enabled: true
      name: envoy-gateway
      namespace: envoy-gateway-system
      port: metrics
      path: /metrics
      selector:
        control-plane: envoy-gateway
        app.kubernetes.io/instance: envoy-gateway

  # An ingress row on every exposure NetworkPolicy (networkPolicy.enabled)
  # admitting the scraper to the proxies' stats port. Empty: no row. The
  # controller's own policy is not this chart's.
  networkPolicy:
    from: []
    #  - namespaceSelector:
    #      matchLabels:
    #        kubernetes.io/metadata.name: monitoring
    #    podSelector:
    #      matchLabels:
    #        app.kubernetes.io/name: vmagent
    port: 19001
