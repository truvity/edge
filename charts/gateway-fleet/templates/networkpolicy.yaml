{{- range $name, $spec := .Values.exposures }}
{{- $raw := $spec | default dict }}
{{- $c := include "gateway.class.resolve" (dict "root" $ "name" $raw.class "spec" (get $.Values.classes ($raw.class | default "")) ) | fromYaml }}
{{- $e := include "gateway.exposure.resolve" (dict "root" $ "name" $name "spec" $raw "class" $c) | fromYaml }}
{{- if and $e.enabled $c.enabled $e.networkPolicy.enabled }}
{{- $np := $e.networkPolicy }}
---
{{- /* The pod selector follows the class's merge mode: Envoy Gateway labels a
       merged fleet by owning-gatewayclass and a split one by owning-gateway.
       On a merged class two exposures select the same pods, and the policies
       union — which is correct, because those pods serve both. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $np.name }}
  namespace: {{ $e.namespace }}
  {{- with include "gateway.annotations" (dict "root" $ "extra" $np.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "gateway.podSelector" (dict "class" $c "exposure" $e) | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- /* The metrics scraper's row goes last, after the estate's own rules. */}}
  {{- $ingress := $np.ingress | default list }}
  {{- with $.Values.metrics.networkPolicy.from }}
  {{- $ingress = append $ingress (dict "from" . "ports" (list (dict "port" $.Values.metrics.networkPolicy.port "protocol" "TCP"))) }}
  {{- end }}
  {{- with $ingress }}
  ingress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- $egress := list }}
  {{- range $np.egressTo }}
  {{- $egress = append $egress (include "gateway.egress.row" . | fromYaml) }}
  {{- end }}
  {{- $egress = concat $egress ($np.egress | default list) }}
  {{- if or $np.xds.enabled $egress }}
  egress:
    {{- if $np.xds.enabled }}
    # xDS to the controller. Structural: without it the proxies never receive
    # a configuration and the exposure is dark, whatever else is allowed.
    - to:
        {{- /* A peer with no namespace selector means the policy's own
               namespace. An exposure in a namespace of its own names the
               controller's (controllerNetworkPolicy.namespace). */}}
        {{- if ne $e.namespace $.Values.controllerNetworkPolicy.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $.Values.controllerNetworkPolicy.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml $np.xds.controllerPodLabels | nindent 14 }}
        {{- else }}
        - podSelector:
            matchLabels:
              {{- toYaml $np.xds.controllerPodLabels | nindent 14 }}
        {{- end }}
      ports:
        - port: {{ $np.xds.port }}
          protocol: TCP
    {{- end }}
    {{- with $egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
