apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cloudflared.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cloudflared.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cloudflared.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cloudflared.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "cloudflared.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- $spread := .Values.topologySpreadConstraints | default list }}
      {{- with .Values.zoneSpread }}
      {{- $spread = append $spread (dict
            "maxSkew" 1
            "topologyKey" "topology.kubernetes.io/zone"
            "whenUnsatisfiable" .
            "labelSelector" (dict "matchLabels" (include "cloudflared.selectorLabels" $ | fromYaml))
            "matchLabelKeys" (list "pod-template-hash")) }}
      {{- end }}
      {{- with $spread }}
      topologySpreadConstraints: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cloudflared
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - cloudflared
            - tunnel
            - --no-autoupdate
            - --metrics
            - 0.0.0.0:2000
            - run
            - --token-file
            - /secrets/{{ .Values.secretKey }}
            {{- range .Values.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 2000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tunnel-token
              mountPath: /secrets
              readOnly: true
            {{- if .Values.caSecretName }}
            - name: origin-ca
              mountPath: /etc/cloudflared/certs
              readOnly: true
            {{- end }}
      volumes:
        - name: tunnel-token
          secret:
            secretName: {{ .Values.secretName }}
        {{- if .Values.caSecretName }}
        # Origin CA root (public cert). The remote tunnel config's
        # originRequest.caPool references /etc/cloudflared/certs/ca.pem,
        # so this mount must exist BEFORE the tunnel config stops using
        # noTLSVerify.
        - name: origin-ca
          secret:
            secretName: {{ .Values.caSecretName }}
        {{- end }}
