# cloudflared — the in-cluster end of a Cloudflare Tunnel.
#
# Scope: Deployment, ServiceAccount and PodDisruptionBudget, nothing else.
# The tunnel itself, its ingress rules and the token are the control
# plane's business (the Cloudflare dashboard, or the Pulumi component in
# this repository); the Secret holding the token is created by whatever
# owns secrets in your estate (External Secrets, SOPS, kubectl). NetworkPolicies are yours too:
# the pod only needs egress to Cloudflare's edge and to the origins the
# tunnel routes to.
#
# Traffic: Cloudflare edge → cloudflared → whatever the remote tunnel
# config names as the origin (typically a Gateway API fleet Service).

# One cluster can need more than one install: a tunnel cannot cross
# Cloudflare accounts, so an estate whose zones live in several accounts
# runs one cloudflared per account. Object names and the pod selector carry
# the release name, so two installs coexist in one namespace. Override only
# if you need a name the release name cannot give you.
nameOverride: ""
fullnameOverride: ""

# Every replica is one connector of the same tunnel: Cloudflare sends a
# request to the closest connected replica and retries another when that
# one fails. Three is one per zone in a three-zone cluster, so losing a
# node or a zone leaves two. Cloudflare allows 25 active replicas per
# tunnel; each opens four connections to the edge.
replicaCount: 3

image:
  repository: cloudflare/cloudflared
  tag: "2026.10.0"
  pullPolicy: IfNotPresent

# Secret holding the tunnel token (`cloudflared tunnel token <id>`), read
# with --token-file so it never appears in the pod spec or in `ps`.
secretName: cloudflared-tunnel-token
secretKey: tunnel-token

# Optional: a Secret (key `ca.pem`) with the CA that signed your origins'
# certificates. Mounted at /etc/cloudflared/certs/ca.pem — point the
# remote tunnel config's originRequest.caPool there and cloudflared
# VERIFIES origin certificates instead of noTLSVerify. Empty: no mount.
caSecretName: ""

# Extra arguments appended to `cloudflared tunnel ... run`.
extraArgs: []

serviceAccount:
  create: true
  # Empty: named after the release, like every other object.
  name: ""
  annotations: {}

terminationGracePeriodSeconds: 30

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}
# Passed through, before the zoneSpread constraint.
topologySpreadConstraints: []
# One replica per zone, selected by this release's own pod labels:
#   ""              no constraint of the chart's own (the default: a cluster
#                   without zone labels would refuse every pod otherwise)
#   DoNotSchedule   a hard rule; a node autoscaler adds a node in the zone
#                   that lacks a replica instead of stacking two in one
#   ScheduleAnyway  a preference the scheduler may break
# The constraint carries matchLabelKeys [pod-template-hash], so a rolling
# update spreads the new ReplicaSet's pods by themselves.
zoneSpread: ""

# A PDB keeps the tunnel up across node drains and node replacement.
# maxUnavailable lets one replica go at a time, whatever replicaCount is.
# minAvailable, when set, is rendered instead of maxUnavailable.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
  minAvailable: null

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
